name: Docker image

on:
  push:
    branches: [master]
    # `v*` is deliberately broad: the job below rejects every tag that is not
    # stable SemVer, which gives a clear failure instead of silently publishing
    # nothing.
    tags: ["v*"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle
      - run: ./gradlew --no-daemon --console=plain test

  publish:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - name: Validate release tag
        if: startsWith(github.ref, 'refs/tags/')
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if [[ ! "$TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::Tag '$TAG' is not stable SemVer vX.Y.Z; pre-release and build metadata are not supported."
            exit 1
          fi

      # Tag policy:
      # - master -> nightly
      # - v1.2.3 -> 1.2.3, 1.2 and 1
      # The image name is lowercased because Docker references are lowercase,
      # even though GitHub owner/repo names are not guaranteed to be.
      - name: Compute image tags
        id: image
        env:
          IMAGE: ghcr.io/${{ github.repository }}
        run: |
          image="${IMAGE,,}"
          if [[ "$GITHUB_REF" == "refs/heads/master" ]]; then
            version=nightly
            tags="$image:nightly"
          else
            version="${GITHUB_REF_NAME#v}"
            minor="${version%.*}"
            major="${version%%.*}"
            tags="$image:$version"$'\n'"$image:$minor"$'\n'"$image:$major"
          fi
          {
            echo "version=$version"
            echo "tags<<EOF"
            echo "$tags"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The native image does not cross-compile. The GitHub runner is amd64, so
      # this builds the supported architecture natively; arm64 needs an arm64
      # runner and a manifest merge rather than QEMU emulation.
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.image.outputs.tags }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.image.outputs.version }}
          cache-from: type=gha,scope=toot-trans
          cache-to: type=gha,mode=max,scope=toot-trans
